name: Machine Learning CI - Advance

on:
  push:
    branches: [ main ]

jobs:
  train-and-push-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install mlflow==2.7.1 dagshub scikit-learn pandas joblib
        # Tambahkan library tambahan agar tidak bentrok dengan DagsHub API
        pip install "requests<2.29.0" "urllib3<2.0.0"

    - name: Run Model Training (MLflow Project)
      env:
        MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
        MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        MLFLOW_TRACKING_URI: https://dagshub.com/zenyfor28/Eksperimen_SML_Zeny-Arsya-Fortilla.mlflow
      run: |
        cd "MLProject (folder)"
        rm -rf mlruns
        mlflow run . --env-manager local --experiment-name "Retail_Final_Project"

    - name: Upload Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: model-hasil-training
        path: |
          MLProject (folder)/mlruns
          MLProject (folder)/model.pkl
        retention-days: 1

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        cd "MLProject (folder)"
        
        # Cari file model.pkl yang dihasilkan oleh modelling.py
        MODEL_FILE=$(find . -name "model.pkl" | head -n 1)
        cp "$MODEL_FILE" ./model.pkl
        
        # Buat Dockerfile otomatis
        cat <<EOF > Dockerfile
        FROM python:3.10-slim
        WORKDIR /app
        COPY model.pkl /app/model.pkl
        RUN pip install scikit-learn pandas joblib
        CMD ["python", "-c", "import joblib; model = joblib.load('model.pkl'); print('Model Retail Zeny Loaded Successfully!')"]
        EOF
        
        # Build dan Push
        docker build -t zeny-retail-model .
        docker tag zeny-retail-model ${{ secrets.DOCKERHUB_USERNAME }}/zeny-arsya-fortilla-m251d5x2016:latest
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/zeny-arsya-fortilla-m251d5x2016:latest
